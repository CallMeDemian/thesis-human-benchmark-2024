name: Broad diagnostic downstream
on:
  push:
    branches: [analysis/human15-archival-expansion]
    paths:
      - 'analysis/broad_diagnostic_downstream.py'
      - 'analysis_outputs/broad_archival/supplementary_archival_diagnostics_v2.csv'
      - '.github/workflows/broad_diagnostic_downstream.yml'
permissions:
  contents: write
concurrency:
  group: broad-diagnostic-downstream
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: human
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: CallMeDemian/thesis-reproduction-kit-v43
          ref: thesis-v43-reproduction-kit-v1.0.4
          path: repro
          lfs: false
          fetch-depth: 1
      - name: Fetch frozen Stage-9 surfaces
        run: |
          git -C repro lfs install --local
          git -C repro lfs pull --include='frozen/original_release/evaluation/llm_final_evaluation_20260913/stage9/BASELINE_STRICT_ITT/llm_stage9_llm_rl_comparison.csv,frozen/original_release/evaluation/llm_final_evaluation_20260913/stage9/HIGH_STRICT_ITT/llm_stage9_llm_rl_comparison.csv' --exclude=''
      - name: Analyze
        run: |
          python -m py_compile human/analysis/broad_diagnostic_downstream.py
          python human/analysis/broad_diagnostic_downstream.py --human human --repro repro --out human/analysis_outputs/broad_archival/downstream
      - name: Commit
        run: |
          git -C human config user.name 'github-actions[bot]'
          git -C human config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C human add analysis_outputs/broad_archival/downstream
          if ! git -C human diff --cached --quiet; then
            git -C human commit -m 'analysis: add downstream results for broad-search diagnostics'
            git -C human pull --rebase origin analysis/human15-archival-expansion
            git -C human push origin HEAD:analysis/human15-archival-expansion
          fi
