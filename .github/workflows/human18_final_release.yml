name: Human-18 final release bundle
on:
  push:
    branches: [analysis/human15-archival-expansion]
    paths:
      - 'analysis_outputs/HUMAN18_FINAL_HANDOFF.md'
      - 'analysis_outputs/broad_archival/**'
      - 'analysis_outputs/human18/**'
      - '.github/workflows/human18_final_release.yml'
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release surface
        run: |
          set -euo pipefail
          test -f analysis_outputs/HUMAN18_FINAL_HANDOFF.md
          test -f analysis_outputs/broad_archival/BROAD_PASS3_FINAL_REVIEW.md
          test -f analysis_outputs/broad_archival/BROAD_PASS3_MANUAL_WEB_ADDENDUM.md
          test -f analysis_outputs/broad_archival/strict_archival_extension_v2.csv
          test -f analysis_outputs/broad_archival/BROAD_PASS3_32_LEAD_COMPLETION_AUDIT.json
          test -f analysis_outputs/human18/CREATE_GOOGLE_FORM.txt
          test -f analysis_outputs/human18/downstream/HUMAN18_DOWNSTREAM_MANIFEST.json
          python - <<'PY'
          import csv, json
          with open('analysis_outputs/human18/RESEARCHER_ONLY_case_key.csv', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==18
          assert ''.join(r['case_alias'] for r in rows)=='ABCDEFGHIJKLMNOPQR'
          m=json.load(open('analysis_outputs/human18/downstream/HUMAN18_DOWNSTREAM_MANIFEST.json', encoding='utf-8'))
          assert m['status']=='PASS' and m['n_cases']==18
          assert m['strict9_regression']['status']=='PASS'
          s=json.load(open('analysis_outputs/human18/SELECTION_AUDIT.json', encoding='utf-8'))
          assert s['build_id']=='H18-v3-20261001' and s['n_cases']==18
          a=json.load(open('analysis_outputs/broad_archival/BROAD_PASS3_32_LEAD_COMPLETION_AUDIT.json', encoding='utf-8'))
          assert a['status']=='PASS' and a['all575_action_title_leads']==32 and a['unresolved_after_completion']==0
          assert a['new_independent_expert_strict_cases']==0 and a['strict_anchor_count_after_broad_search']==9
          print('FINAL_RELEASE_SURFACE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: human18-final-release
          path: |
            analysis_outputs/HUMAN18_FINAL_HANDOFF.md
            analysis_outputs/broad_archival/BROAD_PASS3_FINAL_REVIEW.md
            analysis_outputs/broad_archival/BROAD_PASS3_MANUAL_WEB_ADDENDUM.md
            analysis_outputs/broad_archival/strict_archival_extension_v2.csv
            analysis_outputs/broad_archival/BROAD_PASS3_32_LEAD_COMPLETION_AUDIT.json
            analysis_outputs/broad_archival/BROAD_PASS3_32_LEAD_COMPLETION_AUDIT.md
            analysis_outputs/broad_archival/BROAD_PASS3_32_LEAD_COMPLETION_AUDIT.csv
            evidence/BROAD_PASS3_FINAL_TWO_LEADS_20261001.json
            analysis_outputs/broad_archival/supplementary_archival_diagnostics_v2.csv
            analysis_outputs/human18
