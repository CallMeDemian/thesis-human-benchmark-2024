name: Broad archival pass2/pass3 expansion
on:
  push:
    branches: [analysis/human15-archival-expansion]
    paths:
      - 'analysis/broad_pass2_*.py'
      - 'analysis/broad_pass3_*.py'
      - '.github/workflows/broad_archival_expansion.yml'
permissions:
  contents: write
concurrency:
  group: broad-archival-expansion
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run full broad pass2 discovery
        run: |
          python analysis/broad_pass2_probe.py --human . --out analysis_outputs/broad_archival
          python analysis/broad_pass2_screen.py --human . --input analysis_outputs/broad_archival/broad_pass2_probe.csv --out analysis_outputs/broad_archival
          python analysis/broad_pass2_extract_reports.py --input analysis_outputs/broad_archival/broad_pass2_probe.csv --out analysis_outputs/broad_archival
          python analysis/broad_pass3_recovery.py --human . --out analysis_outputs/broad_archival
          python analysis/broad_all575_title_scan.py --human . --out analysis_outputs/broad_archival
          python analysis/broad_pass3_completion_audit.py --human . --out analysis_outputs/broad_archival
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_outputs/broad_archival
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: complete broad pass2 report-index discovery'
            git pull --rebase origin analysis/human15-archival-expansion
            git push origin HEAD:analysis/human15-archival-expansion
          fi
